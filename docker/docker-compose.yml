version: "3.x"
name: mediafarm

x-env: &env
  MF_DB_DSN: postgresql+asyncpg://mf:mf@postgres:5432/mf
  MF_LOG_FORMAT: json
  MF_SECRET_PROVIDER: env
  MF_UI_SECRET_KEY: ${MF_UI_SECRET_KEY:-change-me-32-bytes-minimum-length}
  MF_UI_BOOTSTRAP_PASSWORD: ${MF_UI_BOOTSTRAP_PASSWORD:-admin-password-123}
  MF_UI_INTERNAL_TOKEN: ${MF_UI_INTERNAL_TOKEN:-internal-dev-token}
  MF_UI_BASE_URL: http://localhost:8080
  MF_SECRET_IN_SMB_USERNAME: ${SMB_USER:-bkntr@mgusit.lan}
  MF_SECRET_IN_SMB_PASSWORD: ${SMB_PASSWORD:-1520Gub@55}
  MF_SECRET_OUT_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mfadmin}
  MF_SECRET_OUT_S3_SECRET_KEY: ${S3_SECRET_KEY:-mfadmin123}
  

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: mf, POSTGRES_PASSWORD: mf, POSTGRES_DB: mf}
    command: >
      postgres -c max_connections=300 -c shared_buffers=512MB
               -c autovacuum_vacuum_scale_factor=0.02
               -c autovacuum_analyze_scale_factor=0.01
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mf -d mf"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    image: mediafarm/migrations:dev
    build: {context: .., dockerfile: docker/migrations.Dockerfile}
    platform: linux/amd64
    environment: *env
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
  adminer:
    image: adminer:latest
    ports: ["8081:8080"]
    depends_on: {postgres: {condition: service_healthy}}

  ui:
    image: mediafarm/ui:dev
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
      args: {APP_BASE: mediafarm/app-base:ui-dev}
    platform: linux/amd64
    environment: *env
    ports: ["8080:8080"]
    volumes: ["./data/in:/data/in", "./data/out:/data/out"]
    depends_on: {migrate: {condition: service_completed_successfully}}

  watcher:
    image: mediafarm/watcher:dev
    build:
      context: ..
      dockerfile: docker/watcher.Dockerfile
      args: {APP_BASE: mediafarm/app-base:watcher-dev}
    platform: linux/amd64
    environment:
      <<: *env
      MF_ROLE: watcher
      MF_METRICS_PORT: "9101"
      MF_WATCHER_POLL_S: "15"
    volumes: ["./data/in:/data/in", "./data/out:/data/out"]
    depends_on: {migrate: {condition: service_completed_successfully}}

  worker-cpu:
    image: mediafarm/worker:dev-cpu
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
      args:
        APP_BASE: mediafarm/app-base:worker-dev
        MEDIA_BASE: mediafarm/media-base:cpu-dev
    platform: linux/amd64
    environment:
      <<: *env
      MF_KIND: cpu
      MF_CPU_SLOTS: "4"
      MF_GPU_SLOTS: "0"
      MF_FFMBC_ENABLED: "true"
      MF_FFMPEG_PATH: /usr/local/bin/ffmpeg
      MF_FFPROBE_PATH: /usr/local/bin/ffprobe
      MF_FFMBC_PATH: /usr/local/bin/ffmbc
      MF_YTDL_PATH: /usr/local/bin/yt-dlp
      MF_LOG_STORAGE: out
    volumes: ["./data/in:/data/in", "./data/out:/data/out", "./data/tmp:/scratch"]
    depends_on: {migrate: {condition: service_completed_successfully}}

  minio:
    image: elestio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mfadmin
      MINIO_ROOT_PASSWORD: mfadmin123
    platform: linux/amd64
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
