[project]
name = "mf-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mf-core",
]

[project.scripts]
mf-worker = "worker.main:cli"

[tool.uv.sources]
mf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]