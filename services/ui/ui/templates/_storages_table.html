{% set tests = tests if tests is defined else {} %}
<div id="storages-table" class="st-table-wrap"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
    <table class="st-table">
        <thead><tr>
            <th>Имя</th><th>Тип</th><th>Base URI</th><th>Секрет</th><th>RO</th><th class="st-th-act">Действия</th>
        </tr></thead>
        <tbody id="st-tbody">
        {% for s in storages %}
        {% with test=tests.get(s.id|string) %}{% include "_storage_row.html" %}{% endwith %}
        {% else %}
        <tr id="st-empty"><td colspan="6" class="st-empty-cell">
            Пока нет хранилищ — добавьте первое в форме ниже.
        </td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
