<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}MediaFarm{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/vendor/htmx-ws.js" defer></script>
    <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
<nav>
    <b>MediaFarm</b>
    <a href="/">Дашборд</a><a href="/jobs">Задачи</a><a href="/assets">Ассеты</a>
    <a href="/folders">Папки</a><a href="/storages">Хранилища</a>
    <a href="/presets">Пресеты</a><a href="/schedules">Расписания</a><a href="/workers">Воркеры</a>
    {% if user and user.role == 'admin' %}<a href="/users">Пользователи</a>{% endif %}
    <span class="spacer"></span>
    {% if user %}<span>{{ user.username }} ({{ user.role }})</span>
    <form method="post" action="/logout" class="inline"><button class="link">Выйти</button></form>{% endif %}
</nav>
{% if msg %}<div class="flash ok">{{ msg }}</div>{% endif %}
{% if err %}<div class="flash err">{{ err }}</div>{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
