{% extends "base.html" %}{% block content %}
<h1>Хранилища</h1>
<table><thead><tr><th>Имя</th><th>Тип</th><th>URI</th><th>Секрет</th><th>RO</th><th></th></tr></thead><tbody>
{% for s in storages %}
<tr><td>{{ s.name }}</td><td>{{ s.kind }}</td><td><code>{{ s.base_uri }}</code></td>
    <td>{{ s.secret_ref or '—' }}</td><td>{{ 'да' if s.read_only else 'нет' }}</td>
    <td class="row">
        <button hx-post="/storages/{{ s.id }}/test" hx-target="#test-{{ s.id }}">Проверить</button>
        <form hx-post="/storages/{{ s.id }}/delete" hx-swap="none"><button>Удалить</button></form>
    </td></tr>
<tr><td colspan="6" id="test-{{ s.id }}"></td></tr>
{% endfor %}</tbody></table>
<div class="card"><h3>Добавить</h3>
    <form hx-post="/storages" hx-swap="none" class="grid">
        <input name="name" placeholder="in_smb" required>
        <select name="kind"><option>local</option><option>nfs</option><option>smb</option><option>s3</option><option>ftp</option></select>
        <input name="base_uri" placeholder="smb://fs01/share" required>
        <input name="mount_path" placeholder="/mnt/share (опц.)">
        <input name="secret_ref" placeholder="env:in_smb">
        <textarea name="options" placeholder='{"endpoint_url":"http://minio:9000"}'></textarea>
        <label><input type="checkbox" name="read_only"> только чтение</label>
        <button>Добавить</button>
    </form></div>
{% endblock %}
