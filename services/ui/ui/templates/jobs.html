{% extends "base.html" %}{% block content %}
<h1>Задачи</h1>
<div class="card">
    <form hx-post="/jobs" hx-swap="none" class="row">
        <input name="url" placeholder="https://… (web-стрим или файл)">
        <input name="input_uri" placeholder="smb://… / s3://… / file://…">
        <select name="preset_name">{% for p in presets %}<option>{{ p.name }}</option>{% endfor %}</select>
        <select name="kind"><option>transcode</option><option>capture</option><option>fetch</option><option>probe</option></select>
        <input name="priority" type="number" value="100" min="0" max="1000" style="width:6rem">
        <button>Поставить задачу</button>
    </form>
</div>
<form method="get" class="row">
    <select name="state" onchange="this.form.submit()">
        <option value="">все</option>
        {% for s in ['queued','running','succeeded','failed','cancelled'] %}
        <option value="{{ s }}" {% if state==s %}selected{% endif %}>{{ s }}</option>{% endfor %}
    </select>
</form>
<div hx-ext="ws" ws-connect="/ws/jobs{% if state %}?state={{ state }}{% endif %}">
    <table>
        <thead><tr><th>ID</th><th>Тип</th><th>Состояние</th><th>Шаг</th><th>Прогресс</th>
            <th>Speed</th><th>Попытки</th><th>Воркер</th><th>Ресурс</th></tr></thead>
        <tbody id="jobs-body">
        {% for job in jobs %}{% include "_job_row.html" %}{% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
