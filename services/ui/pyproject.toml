[project]
name = "mf-ui"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mf-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "apscheduler>=3.10",
    "croniter>=2.0",
]

[project.scripts]
mf-ui = "ui.app:cli"

[tool.uv.sources]
mf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ui"]