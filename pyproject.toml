[project]
name = "mediafarm"
version = "0.1.0"
description = "Media conversion & media asset management platform"
requires-python = ">=3.12"
dependencies = ["mf-core", "mf-ui", "mf-watcher", "mf-worker"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
mf-core = { workspace = true }
mf-ui = { workspace = true }
mf-watcher = { workspace = true }
mf-worker = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23.7",
  "pytest-cov>=5.0",
  "testcontainers[postgres]>=4.7",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-aiofiles",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: требует Docker/Postgres",
  "gpu: требует NVIDIA GPU",
]
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = ["migrations/"]