apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mf.fullname" . }}-watcher
spec:
  replicas: {{ .Values.watcher.replicas }}
  selector:
    matchLabels:
      {{- include "mf.selector" . | nindent 6 }}
      app.kubernetes.io/component: watcher
  template:
    metadata:
      labels:
        {{- include "mf.selector" . | nindent 8 }}
        app.kubernetes.io/component: watcher
    spec:
      containers:
        - name: watcher
          image: {{ include "mf.image" (dict "root" . "name" "watcher") }}
          ports: [{name: metrics, containerPort: {{ .Values.watcher.metricsPort }}}]
          envFrom:
            - configMapRef: {name: {{ include "mf.fullname" . }}-config}
            - secretRef: {name: {{ include "mf.secretName" . }}}
          env:
            - {name: MF_ROLE, value: watcher}
            - {name: MF_METRICS_PORT, value: {{ .Values.watcher.metricsPort | quote }}}
            - name: MF_DB_DSN
              valueFrom: {secretKeyRef: {name: {{ include "mf.secretName" . }}, key: db-dsn}}
          resources: {{- toYaml .Values.watcher.resources | nindent 12 }}