  {{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mf.fullname" . }}-secrets
  labels: {{- include "mf.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-dsn: {{ .Values.secrets.dbDsn | quote }}
  ui-secret-key: {{ .Values.secrets.uiSecretKey | quote }}
  ui-bootstrap-password: {{ .Values.secrets.uiBootstrapPassword | quote }}
  internal-token: {{ .Values.secrets.internalToken | quote }}
  keda-connection: {{ .Values.secrets.kedaConnection | quote }}
  {{- range $k, $v := .Values.secrets.storage }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}