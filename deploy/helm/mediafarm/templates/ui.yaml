apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mf.fullname" . }}-ui
  labels: {{- include "mf.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "mf.selector" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "mf.selector" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ui
          image: {{ include "mf.image" (dict "root" . "name" "ui") }}
          ports: [{name: http, containerPort: {{ .Values.ui.port }}}]
          envFrom:
            - configMapRef: {name: {{ include "mf.fullname" . }}-config}
            - secretRef: {name: {{ include "mf.secretName" . }}}
          env:
            - {name: MF_ROLE, value: ui}
            - name: MF_DB_DSN
              valueFrom: {secretKeyRef: {name: {{ include "mf.secretName" . }}, key: db-dsn}}
            - name: MF_UI_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "mf.secretName" . }}, key: ui-secret-key}}
            - name: MF_UI_BOOTSTRAP_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "mf.secretName" . }}, key: ui-bootstrap-password}}
            - name: MF_UI_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "mf.secretName" . }}, key: internal-token}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mf.fullname" . }}-ui
spec:
  selector:
    {{- include "mf.selector" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports: [{name: http, port: 80, targetPort: http}]
  {{- if .Values.ui.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mf.fullname" . }}-ui
spec:
  ingressClassName: {{ .Values.ui.ingress.className }}
  rules:
    - host: {{ .Values.ui.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mf.fullname" . }}-ui
                port: {number: 80}
  {{- end }}