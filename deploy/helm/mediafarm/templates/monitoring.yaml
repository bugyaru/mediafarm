{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mf.fullname" . }}-metrics
spec:
  clusterIP: None
  selector:
    {{- include "mf.selector" . | nindent 4 }}
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mf.fullname" . }}
spec:
  selector:
    matchLabels:
      {{- include "mf.selector" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: 15s
  {{- end }}
---
  {{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mf.fullname" . }}-ui
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "mf.selector" . | nindent 6 }}
      app.kubernetes.io/component: ui
  {{- end }}
---
  {{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mf.fullname" . }}-default
spec:
  podSelector:
    matchLabels:
      {{- include "mf.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mf.selector" . | nindent 14 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "mf.selector" . | nindent 14 }}
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
  {{- end }}