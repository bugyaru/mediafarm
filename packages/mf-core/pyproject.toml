[project]
name = "mf-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "orjson>=3.10",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "fsspec>=2024.6",
    "s3fs>=2024.6",
    "smbprotocol>=1.13",
    "aioftp>=0.22",
    "aiofiles>=23.2",
    "nvidia-ml-py>=12.555",
    "watchdog>=4.0",
    "defusedxml>=0.7",
    "libnfs>=1.0.0",
    "asgi-lifespan>=2.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mf_core"]